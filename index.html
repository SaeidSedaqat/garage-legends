<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#121925">
  <title>Garage Legends</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="game"></div>

    <div id="ui">
      <!-- Garage screen -->
      <div id="garage-ui" class="screen">
        <header class="topbar" id="topbar">
          <div class="wallet panel">
            <div class="cash-icon" aria-hidden="true">$</div>
            <div>
              <div class="money" id="money">$0</div>
              <div class="rates"><span id="rate-click"></span><span id="rate-auto"></span></div>
            </div>
          </div>
          <div class="car-chip panel" id="car-chip"></div>
          <button class="icon-btn panel" id="btn-trophies" aria-label="Achievements"><i class="badge"></i></button>
          <button class="icon-btn panel" id="btn-settings" aria-label="Settings"></button>
        </header>

        <button class="goal-chip panel" id="goal-chip"></button>

        <div class="tap-hint" id="tap-hint">Tap your car to earn cash!</div>

        <!-- the garage view: flip through cars, buy the one on show, go racing -->
        <button class="car-arrow prev panel" id="car-prev" aria-label="Previous car"></button>
        <button class="car-arrow next panel" id="car-next" aria-label="Next car"></button>
        <div class="car-buy panel" id="car-buy" hidden></div>
        <button class="race-btn" id="btn-race"></button>

        <!-- right-hand panel (bottom on phones held upright): upgrades, or the race list -->
        <section class="dock" id="dock">
          <header class="dock-bar">
            <h2 id="dock-title">Upgrades</h2>
            <button class="btn" id="dock-back" hidden>Back</button>
          </header>
          <div class="tabs" id="sheet-tabs"></div>
          <div class="sheet-body" id="sheet-body"></div>
        </section>
      </div>

      <!-- Race screen -->
      <div id="race-ui" class="screen" hidden>
        <header class="race-top" id="race-top">
          <button class="icon-btn panel" id="btn-pause" aria-label="Pause"></button>
          <div class="race-info panel">
            <div class="race-name" id="race-name"></div>
            <div class="race-sub" id="race-sub"></div>
          </div>
          <div class="race-reward panel" id="race-reward"></div>
        </header>

        <div class="progress" id="progress">
          <div class="line"></div>
          <span class="dot opp" id="dot-opp"></span>
          <span class="dot you" id="dot-you"></span>
          <span class="flag" aria-hidden="true"></span>
          <span class="gap" id="race-gap"></span>
        </div>

        <div class="race-dim" id="race-dim"></div>
        <div class="callout" id="callout"></div>

        <footer class="race-hud" id="race-hud">
          <div class="tach" id="tach"></div>
          <div class="gear-box"><div class="gear" id="gear">1</div><div class="label">Gear</div></div>
          <div class="msg" id="race-msg"></div>
          <div class="speedo"><div class="speed" id="speed">0</div><div class="label" id="speed-unit">KM/H</div></div>
          <button class="shift-btn" id="btn-shift"><span id="shift-label">HOLD</span><small id="shift-hint">release on green</small></button>
        </footer>
      </div>

      <div class="loading" id="loading"><img class="loading-logo" src="assets/logo.png" alt="Garage Legends"><div class="loading-bar"><i></i></div></div>
      <div class="modal" id="modal" hidden><div class="modal-card panel" id="modal-card"></div></div>
      <div class="toast" id="toast"></div>
      <div class="coach" id="coach" hidden><div class="coach-text" id="coach-text"></div></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
